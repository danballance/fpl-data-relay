services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${FPL_DATABASE_URL:?FPL_DATABASE_URL is required}
      FPL_API_BASE_URL: ${FPL_API_BASE_URL:?FPL_API_BASE_URL is required}
      FPL_CLIENT_USER_AGENT: ${FPL_CLIENT_USER_AGENT:?FPL_CLIENT_USER_AGENT is required}
      HTTP_TIMEOUT_SECONDS: ${FPL_HTTP_TIMEOUT_SECONDS:?FPL_HTTP_TIMEOUT_SECONDS is required}
      REFERENCE_POLL_SECONDS: ${FPL_REFERENCE_POLL_SECONDS:?FPL_REFERENCE_POLL_SECONDS is required}
      LIVE_POLL_SECONDS: ${FPL_LIVE_POLL_SECONDS:?FPL_LIVE_POLL_SECONDS is required}
      IDLE_POLL_SECONDS: ${FPL_IDLE_POLL_SECONDS:?FPL_IDLE_POLL_SECONDS is required}
      SSE_HEARTBEAT_SECONDS: ${FPL_SSE_HEARTBEAT_SECONDS:?FPL_SSE_HEARTBEAT_SECONDS is required}
      POSTGRES_MAINTENANCE_DATABASE_URL: ${FPL_POSTGRES_MAINTENANCE_DATABASE_URL:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${FPL_POSTGRES_DB:?FPL_POSTGRES_DB is required}
      POSTGRES_USER: ${FPL_POSTGRES_USER:?FPL_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${FPL_POSTGRES_PASSWORD:?FPL_POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres-data:
