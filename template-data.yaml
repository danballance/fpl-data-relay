AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Durable protected data stack for FPL Data Relay.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address for persistent monthly budget notifications.

Resources:
  DatabaseVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/24
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database"

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DatabaseVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/26
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-a"

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DatabaseVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.0.64/26
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-b"

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated subnets for FPL Relay Aurora.
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora accessed only through the RDS Data API.
      VpcId: !Ref DatabaseVpc
      SecurityGroupEgress: []

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: "17.7"
      DatabaseName: fplrelay
      MasterUsername: relay_admin
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      Port: 5432
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: 2
        SecondsUntilAutoPause: 300
      BackupRetentionPeriod: 7
      DeletionProtection: true
      StorageEncrypted: true
      CopyTagsToSnapshot: true

  DatabaseWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      EnablePerformanceInsights: false
      MonitoringInterval: 0

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: 20
          Unit: USD
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL

Outputs:
  DatabaseClusterArn:
    Description: RDS Data API resource ARN imported by the application stack.
    Value: !GetAtt DatabaseCluster.DBClusterArn
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseClusterArn"
  DatabaseClusterIdentifier:
    Description: Physical cluster identifier for database administration.
    Value: !Ref DatabaseCluster
  DatabaseSecretArn:
    Description: Managed database secret imported by the application stack.
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseSecretArn"
  DatabaseName:
    Description: PostgreSQL database name imported by the application stack.
    Value: fplrelay
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseName"
