AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Disposable serverless application stack for FPL Data Relay.

Parameters:
  DataStackName:
    Type: String
    AllowedPattern: "^[a-zA-Z][-a-zA-Z0-9]*$"
    Description: Name of the independently deployed FPL Relay data stack.
  AlertEmail:
    Type: String
    Description: Email address for disposable operational notifications.
  CollectorPrincipalArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:iam::[0-9]{12}:user/.+$"
    Description: ARN of the dedicated IAM user allowed to assume the collector role.
  PayloadPrefix:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9/_-]*$"
    Description: S3 key prefix reserved for collected FPL payloads.

Globals:
  Function:
    Runtime: python3.14
    Architectures: [x86_64]
    Environment:
      Variables:
        DATABASE_EXECUTOR: rds_data
        DATABASE_RESOURCE_ARN:
          Fn::ImportValue: !Sub "${DataStackName}-DatabaseClusterArn"
        DATABASE_SECRET_ARN:
          Fn::ImportValue: !Sub "${DataStackName}-DatabaseSecretArn"
        DATABASE_NAME:
          Fn::ImportValue: !Sub "${DataStackName}-DatabaseName"

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: fpl_data_relay.lambda_api.handler
      MemorySize: 512
      Timeout: 28
      ReservedConcurrentExecutions: 5
      Policies:
        - Statement:
            - Sid: UseDataApi
              Effect: Allow
              Action:
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:ExecuteStatement
                - rds-data:RollbackTransaction
              Resource:
                Fn::ImportValue: !Sub "${DataStackName}-DatabaseClusterArn"
            - Sid: ReadDatabaseSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                Fn::ImportValue: !Sub "${DataStackName}-DatabaseSecretArn"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 240
      MessageRetentionPeriod: 86400
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 3

  CollectedPayloadDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CollectedPayloadQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 240
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CollectedPayloadDeadLetterQueue.Arn
        maxReceiveCount: 3

  CollectedPayloadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCollectedPayloads
            Prefix: !Sub "${PayloadPrefix}/"
            Status: Enabled
            ExpirationInDays: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref CollectorPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CollectFplPayloads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeFetchJobs
                Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt IngestionQueue.Arn
              - Sid: PublishCollectedPayloads
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CollectedPayloadQueue.Arn
              - Sid: UploadCollectedPayloads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${CollectedPayloadBucket.Arn}/${PayloadPrefix}/*"

  LiveScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${AWS::StackName}-live"

  ScheduleTargetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendIngestionJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt IngestionQueue.Arn

  DailyReferenceSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-reference-daily"
      Description: Refresh FPL reference data at 04:00 Europe/London.
      ScheduleExpression: cron(0 4 * * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt IngestionQueue.Arn
        RoleArn: !GetAtt ScheduleTargetRole.Arn
        Input: '{"version":1,"kind":"reference"}'

  IngestionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: fpl_data_relay.lambda_ingestion.handler
      MemorySize: 1024
      Timeout: 180
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          FETCH_QUEUE_URL: !Ref IngestionQueue
          FETCH_QUEUE_ARN: !GetAtt IngestionQueue.Arn
          PAYLOAD_BUCKET: !Ref CollectedPayloadBucket
          PAYLOAD_PREFIX: !Ref PayloadPrefix
          LIVE_SCHEDULE_GROUP_NAME: !Ref LiveScheduleGroup
          SCHEDULE_TARGET_ROLE_ARN: !GetAtt ScheduleTargetRole.Arn
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt CollectedPayloadQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestionQueue.QueueName
        - Statement:
            - Sid: UseDataApi
              Effect: Allow
              Action:
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:ExecuteStatement
                - rds-data:RollbackTransaction
              Resource:
                Fn::ImportValue: !Sub "${DataStackName}-DatabaseClusterArn"
            - Sid: ReadDatabaseSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                Fn::ImportValue: !Sub "${DataStackName}-DatabaseSecretArn"
            - Sid: ReadCollectedPayloads
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${CollectedPayloadBucket.Arn}/${PayloadPrefix}/*"
            - Sid: ManageLiveSchedules
              Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:UpdateSchedule
              Resource:
                - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${LiveScheduleGroup}/fpl-live-*"
            - Sid: ListLiveSchedules
              Effect: Allow
              Action: scheduler:ListSchedules
              Resource: "*"
            - Sid: PassScheduleTargetRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt ScheduleTargetRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt CollectedPayloadQueue.Arn
            BatchSize: 1
            Enabled: true

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestionFunction}"
      RetentionInDays: 14

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  FetchDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Fetch jobs reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  CollectedPayloadDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Collected payloads reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectedPayloadDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  FetchQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Fetch jobs have waited more than five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestionQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  CollectedPayloadQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Collected payloads have waited more than five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectedPayloadQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  IngestionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Repeated ingestion Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StripApiPrefixFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-strip-api-prefix"
      AutoPublish: true
      FunctionConfig:
        Comment: Strip /api before forwarding to API Gateway.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.substring(4) || "/";
          return request;
        }

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless frontend routes to index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (!request.uri.includes(".")) {
            request.uri = "/index.html";
          }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # AWS managed policy: Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # AWS managed policy: Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            # AWS managed policy: Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS managed policy: Managed-AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            # AWS managed policy: Managed-SecurityHeadersPolicy
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripApiPrefixFunction.FunctionARN

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  CloudFrontUrl:
    Description: Public application URL.
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  ApiEndpoint:
    Description: Direct HTTP API endpoint for diagnostics.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  FrontendBucketName:
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  FetchQueueUrl:
    Value: !Ref IngestionQueue
  FetchDeadLetterQueueUrl:
    Value: !Ref IngestionDeadLetterQueue
  CollectedPayloadQueueUrl:
    Value: !Ref CollectedPayloadQueue
  CollectedPayloadDeadLetterQueueUrl:
    Value: !Ref CollectedPayloadDeadLetterQueue
  CollectedPayloadBucketName:
    Value: !Ref CollectedPayloadBucket
  CollectedPayloadPrefix:
    Value: !Ref PayloadPrefix
  CollectorRoleArn:
    Value: !GetAtt CollectorRole.Arn
